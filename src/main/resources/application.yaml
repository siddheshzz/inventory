spring:
  application:
    name: inventoryManagement

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: postgres
    password: a
  data:
    redis:
      host: redis-cache
      port: 6379
      timeout: 60000
  #    driver-class-name: org.postgresql.Driver
  web:
    error:
      # Boot 4 moved error props from server.error.* to spring.web.error.*.
      # Surfaces exception messages (e.g. "Not enough stock…") in the
      # default error JSON so API clients can display them.
      include-message: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: 7QnL9vX2aT8mYpR4kJ6sW1eH5uB3zNcF8dGhK2LmP9rTxVq
  expiration: 86400000

server:
  error:
    # Boot 3 key — inactive on Boot 4 (kept for reference).
    include-message: always

