spring:
  application:
    name: inventoryManagement

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: a
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
  #    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: "your-super-secret-key-that-is-at-least-256-bits-long-for-security"

