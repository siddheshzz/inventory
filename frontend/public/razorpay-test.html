<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Razorpay test</title>
</head>
<body>
<h1>Test payment — ₹100</h1>

<p><input id="key" placeholder="Your test Key ID"></p>
<p><input id="order" placeholder="Razorpay order ID from Postman"></p>
<button id="pay">Open test checkout</button>
<pre id="result"></pre>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    document.getElementById("pay").onclick = function () {
        const key = document.getElementById("key").value.trim();
        const orderId = document.getElementById("order").value.trim();
        const result = document.getElementById("result");

        if (!key.startsWith("rzp_test_") || !orderId.startsWith("order_")) {
            result.textContent = "Enter a test Key ID and a Razorpay order ID.";
            return;
        }

        const checkout = new Razorpay({
            key: key,
            order_id: orderId,
            amount: 10000,
            currency: "INR",
            name: "Inventory learning project",
            description: "Test payment",
            handler: function (response) {
                result.textContent =
                    "Checkout returned a result. Backend verification is next.\n" +
                    JSON.stringify(response, null, 2);
            }
        });

        checkout.on("payment.failed", function (response) {
            result.textContent = response.error.description;
        });

        checkout.open();
    };
</script>
</body>
</html>
